name: Moodle plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            moodle-branch: MOODLE_401_STABLE
          - php: '8.3'
            moodle-branch: MOODLE_405_STABLE
          - php: '8.3'
            moodle-branch: MOODLE_503_STABLE
    steps:
      - uses: actions/checkout@v5
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, xmlrpc, soap, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install moodle-plugin-ci
        run: |
          sudo locale-gen en_AU.UTF-8
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin; pwd)" >> $GITHUB_PATH
      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      - run: moodle-plugin-ci phplint
      - name: phpcs
        run: |
          moodle-plugin-ci phpcs --max-warnings 0 > phpcs.txt 2>&1 || { echo "::error::$(tr '\n' ' ' < phpcs.txt | tr -s ' ' | tail -c 1800)"; cat phpcs.txt; exit 1; }
      - run: moodle-plugin-ci phpdoc --max-warnings 0
      - run: moodle-plugin-ci validate
      - run: moodle-plugin-ci savepoints
      - run: moodle-plugin-ci grunt --max-lint-warnings 0
      - name: phpunit
        run: |
          moodle-plugin-ci phpunit > phpunit.txt 2>&1 || { echo "::error::$(tr '\n' ' ' < phpunit.txt | tr -s ' ' | tail -c 1800)"; cat phpunit.txt; exit 1; }
